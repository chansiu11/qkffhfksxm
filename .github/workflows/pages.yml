name: Deploy FPS client to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html menu.css config.js multiplayer-client.js weapon-viewmodels.js ads-system.js \
            shotgun-pellets.js melee-rules.js crosshair-profile.js crosshair-ui.js public/
          mkdir -p public/assets
          cp -r assets/weapons public/assets/weapons
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4