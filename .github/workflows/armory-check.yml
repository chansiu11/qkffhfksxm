name: Multiplayer armory checks
on:
  push:
    paths:
      - 'tests/armory-online.test.js'
      - 'tests/hit-registry.test.js'
      - 'server/hit-registry.js'
      - 'server/weapons.json'
      - 'server/room-core.js'
      - '.github/workflows/armory-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  armory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/hit-registry.test.js tests/armory-online.test.js tests/spread-online.test.js tests/hitscan-reload-online.test.js
